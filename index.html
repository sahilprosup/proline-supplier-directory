<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Line — Supplier Directory</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --card-border: #262626;
    --red: #c0392b;
    --red-dark: #8e2a20;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --pill-bg: rgba(192,57,43,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  a { color: inherit; text-decoration: none; }

  header {
    background: linear-gradient(120deg, #000000 0%, #3a0a0a 100%);
    border-bottom: 1px solid #2a2a2a;
    padding: 22px 28px;
    display:flex;
    align-items:center;
    gap: 18px;
  }
  .logo-mark {
    width: 34px; height: 34px;
    background: var(--red);
    clip-path: polygon(35% 0, 100% 0, 65% 100%, 0 100%);
    flex-shrink:0;
  }
  .brand-text h1 {
    font-size: 1.3rem;
    letter-spacing: 1px;
    display:flex; align-items:center; gap:10px;
  }
  .brand-text h1 .divider { color:#555; font-weight:300; }
  .brand-text h1 .sub-title { font-weight:400; color:var(--text); }
  .brand-text p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  /* Tabs */
  .tabs {
    display:flex; gap: 8px; padding: 18px 28px 0;
    border-bottom: 1px solid #222;
  }
  .tab-btn {
    background: none; border: none; color: var(--muted);
    font-size: 0.95rem; font-weight: 700; padding: 10px 18px;
    cursor: pointer; border-bottom: 3px solid transparent;
    display:flex; align-items:center; gap:8px;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--red); }
  .tab-btn:hover { color: var(--text); }

  .view { display:none; }
  .view.active { display:block; }

  .controls {
    display:flex; gap: 14px; padding: 22px 28px; flex-wrap: wrap;
  }
  .controls input, .controls select {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .controls input { flex: 1; min-width: 240px; }
  .controls input::placeholder { color: var(--muted); }
  .controls select { min-width: 180px; cursor:pointer; }
  .controls input:focus, .controls select:focus { outline: 1px solid var(--red); }

  main { padding: 4px 28px 48px; }
  .grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 22px;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  .pill {
    align-self:flex-start;
    background: var(--pill-bg);
    color: #e2685c;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(192,57,43,0.4);
  }
  .card-head {
    display:flex; align-items:center; gap: 14px;
  }
  .avatar {
    width: 48px; height: 48px;
    background: #000;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: 0.75rem;
    flex-shrink:0;
    text-align:center;
    line-height:1.1;
  }
  .card-head h3 { font-size: 1.1rem; font-weight:700; }
  .card-head .contact-name { color: var(--muted); font-size: 0.88rem; margin-top:2px; }

  .field-label { color: var(--muted); font-size: 0.85rem; }
  .field-value { font-weight: 600; }
  .field-value.link { color: #e2685c; text-decoration: underline; }

  .btn-row { display:flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-secondary { background: #262626; color: var(--text); }
  .btn-secondary:hover { background: #333; }

  .notes { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .notes b { color: #ccc; }

  .qr-box {
    display:none;
    margin-top: 8px;
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    align-self:flex-start;
  }
  .qr-box img { display:block; width: 140px; height: 140px; }
  .qr-box.show { display:block; }

  .empty-state {
    text-align:center;
    color: var(--muted);
    padding: 60px 0;
    display:none;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e1e1e; border: 1px solid var(--red);
    color: #fff; padding: 12px 22px; border-radius: 8px;
    font-size: 0.9rem; opacity:0; pointer-events:none; transition: opacity 0.25s;
    z-index: 999;
  }
  .toast.show { opacity:1; }

  /* Pricing section */
  .price-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 20px;
  }
  .price-card-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
  }
  .price-card-head h3 { font-size: 1.1rem; }
  .price-card-head .quote-count { color: var(--muted); font-size: 0.82rem; }

  table.price-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  table.price-table th {
    text-align:left; color: var(--muted); font-weight:600;
    padding: 8px 10px; border-bottom: 1px solid var(--card-border);
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  table.price-table td {
    padding: 10px; border-bottom: 1px solid #1f1f1f;
  }
  table.price-table tr:last-child td { border-bottom: none; }
  .price-empty {
    color: var(--muted); font-size: 0.88rem; padding: 6px 2px;
  }

  @media (max-width: 480px) {
    header { padding: 18px; }
    .tabs, .controls, main { padding-left: 18px; padding-right: 18px; }
    table.price-table { font-size: 0.8rem; }
  }
</style>
</head>

<header>
  <div class="logo-mark"></div>
  <div class="brand-text">
    <h1>PRO LINE <span class="divider">|</span> <span class="sub-title">Supplier Directory</span></h1>
    <p>Tap to call, tap to email — or show a QR code to call from another device</p>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabContactsBtn" onclick="switchTab('contacts')">Contacts</button>
  <button class="tab-btn" id="tabPricingBtn" onclick="switchTab('pricing')">Supplier Pricing</button>
</div>

<!-- CONTACTS VIEW -->
<div class="view active" id="view-contacts">
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search supplier, contact or category">
    <select id="categoryFilter">
      <option value="all">All categories</option>
    </select>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState">No suppliers match your search.</div>
  </main>
</div>

<!-- PRICING VIEW -->
<div class="view" id="view-pricing">
  <div class="controls">

  </div>

  <main>
    <div id="pricingList"></div>

  </main>
</div>

  function initials(name) {
    return name
      .replace(/[^a-zA-Z0-9 ]/g, "")
      .split(" ")
      .filter(Boolean)
      .slice(0, 2)
      .map(w => w[0])
      .join("")
      .toUpperCase();
  }

  function telHref(phone) {
    return "tel:" + phone.replace(/[^0-9+]/g, "");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  function copyText(text, label) {
    navigator.clipboard.writeText(text).then(() => showToast(label + " copied"));
  }

  function isMobile() {
    return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  function openEmail(email) {
    // Plain mailto: keeps the To field as just the address, on both
    // phone (opens the mail app) and desktop (opens the default mail handler).
    window.location.href = "mailto:" + email;
  }

  function toggleQr(id) {
    const box = document.getElementById(id);
    box.classList.toggle("show");
  }

  function dataUriToBlobUrl(dataUri) {
    const commaIdx = dataUri.indexOf(",");
    const header = dataUri.slice(0, commaIdx);
    const base64 = dataUri.slice(commaIdx + 1);
    const mimeMatch = header.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : "application/pdf";
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: mime });
    return URL.createObjectURL(blob);
  }

  function viewPdf(company, idx) {
    const file = quoteFiles[company][idx];
    const url = dataUriToBlobUrl(file.data);
    window.open(url, "_blank");
  }

  function downloadPdf(company, idx) {
    const file = quoteFiles[company][idx];
    const url = dataUriToBlobUrl(file.data);
    const a = document.createElement("a");
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function switchTab(tab) {
    document.getElementById("view-contacts").classList.toggle("active", tab === "contacts");
    document.getElementById("view-pricing").classList.toggle("active", tab === "pricing");
    document.getElementById("tabContactsBtn").classList.toggle("active", tab === "contacts");
    document.getElementById("tabPricingBtn").classList.toggle("active", tab === "pricing");
  }

  function render(list) {
    const grid = document.getElementById("grid");
    const empty = document.getElementById("emptyState");
    grid.innerHTML = "";

    if (list.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.forEach((s, i) => {
      const card = document.createElement("div");
      card.className = "card";

      let html = `<span class="pill">${s.category}</span>`;
      html += `<div class="card-head">
                  <div class="avatar">${initials(s.name)}</div>
                  <div>
                    <h3>${s.name}</h3>
                    <div class="contact-name">${s.contact}</div>
                  </div>
                </div>`;

      if (s.phone) {
        const tel = telHref(s.phone);
        const qrId = "qr-" + i;
        html += `<div>
                    <div class="field-label">Phone</div>
                    <div class="field-value">${s.phone}</div>
                  </div>
                  <div class="btn-row">
                    <a class="btn btn-primary" href="${tel}">Call now</a>
                    <button class="btn btn-secondary" onclick="copyText('${s.phone}','Number')">Copy number</button>
                    <button class="btn btn-secondary" onclick="toggleQr('${qrId}')">Show QR to call</button>
                  </div>
                  <div class="qr-box" id="${qrId}">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(tel)}" alt="QR code to call ${s.name}">
                  </div>`;
      }

      if (s.email) {
        html += `<div>
                    <div class="field-label">Email</div>
                    <div class="field-value link">${s.email}</div>
                  </div>
                  <div class="btn-row">
                    <button class="btn btn-primary" onclick="openEmail('${s.email}')">Email now</button>
                    <button class="btn btn-secondary" onclick="copyText('${s.email}','Email')">Copy email</button>
                  </div>`;
      }

      if (s.notes) {
        html += `<div class="notes"><b>Notes:</b> ${s.notes}</div>`;
      }

      card.innerHTML = html;
      grid.appendChild(card);
    });
  }

  function populateCategories() {
    const select = document.getElementById("categoryFilter");
    const cats = [...new Set(suppliers.map(s => s.category))].sort();
    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    });
  }

  function applyFilters() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    const cat = document.getElementById("categoryFilter").value;
    const filtered = suppliers.filter(s => {
      const matchesCat = cat === "all" || s.category === cat;
      const matchesQ = !q ||
        s.name.toLowerCase().includes(q) ||
        s.contact.toLowerCase().includes(q) ||
        s.category.toLowerCase().includes(q) ||
        (s.notes && s.notes.toLowerCase().includes(q));
      return matchesCat && matchesQ;
    });
    render(filtered);
  }

  function renderPricing(filterText) {
    const list = document.getElementById("pricingList");
    const empty = document.getElementById("pricingEmptyState");
    list.innerHTML = "";

    const q = (filterText || "").toLowerCase();
    const companies = Object.keys(pricing).sort();

    const visibleCompanies = companies.filter(company => {
      if (!q) return true;
      if (company.toLowerCase().includes(q)) return true;
      return (quoteFiles[company] || []).some(f =>
        (f.name || "").toLowerCase().includes(q)
      );
    });

    if (visibleCompanies.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    visibleCompanies.forEach(company => {
      const div = document.createElement("div");
      div.className = "price-card";

      const files = quoteFiles[company] || [];

      let html = `<div class="price-card-head">
                    <h3>${company}</h3>
                    <span class="quote-count">${files.length} quote sheet${files.length === 1 ? "" : "s"} on file</span>
                  </div>`;

      if (files.length === 0) {
        html += `<div class="price-empty">No quote sheets on file yet. Send one over and it'll be added here.</div>`;
      } else {
        html += `<div class="btn-row">`;
        files.forEach((f, idx) => {
          html += `<button class="btn btn-primary" onclick="viewPdf('${company}', ${idx})">View PDF – ${f.name}</button>
                    <button class="btn btn-secondary" onclick="downloadPdf('${company}', ${idx})">Download</button>`;
        });
        html += `</div>`;
      }

      div.innerHTML = html;
      list.appendChild(div);
    });
  }

  document.getElementById("searchInput").addEventListener("input", applyFilters);
  document.getElementById("categoryFilter").addEventListener("change", applyFilters);
  document.getElementById("priceSearchInput").addEventListener("input", (e) => renderPricing(e.target.value));

  populateCategories();
  render(suppliers);
  renderPricing("");
</script>

</body>
</html>
